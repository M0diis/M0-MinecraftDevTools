plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // JitPack hosts several GitHub-built artifacts (e.g. com.github.kdl-org:kdl4j)
    maven {
        url = uri('https://jitpack.io')
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:midnightlib:${project.midnightlib_version}"

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

    implementation 'org.apache.groovy:groovy:5.0.8'
    include 'org.apache.groovy:groovy:5.0.8'

    implementation "org.graalvm.js:js-scriptengine:25.0.3"
    implementation "org.graalvm.js:js:25.0.3"
    // JavaScriptScriptManager uses the Polyglot API directly (it comes with GraalJS; listed so the compile classpath is explicit).
    implementation "org.graalvm.polyglot:polyglot:25.0.3"

    implementation("org.jetbrains.kotlin:kotlin-scripting-jsr223:2.4.21")
    implementation("eu.jrie.jetbrains:kotlin-shell-core:0.2.1") {
        // Its 2019-era coroutines artifact shadows the kotlinx-coroutines-core-jvm the Kotlin 2.x compiler needs.
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-core"
    }

    include "org.jetbrains.kotlin:kotlin-scripting-jsr223:2.4.21"
    include "eu.jrie.jetbrains:kotlin-shell-core:0.2.1"
    include "org.graalvm.js:js-scriptengine:25.0.3"
    include "org.graalvm.js:js:25.0.3"

    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.21"
    implementation "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:2.4.21"
    include "org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.21"
    include "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:2.4.21"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    accessWidenerPath = file("src/main/resources/m0dev.accesswidener")

    runs {
        client {
            programArgs "--username", "M0dii"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    // Real parameter names for the script editor's completion (m0.sleep(millis) instead of m0.sleep(num1)).
    it.options.compilerArgs.add("-parameters")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'm0-dev-tools-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

loom.runs.named('clientGameTest') {
    vmArg '-Dfabric.disableErrorGui=true'
}
